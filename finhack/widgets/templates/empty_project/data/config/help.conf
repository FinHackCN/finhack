FinHack 量化框架

用法: finhack {module} {action} [参数...]

常用命令:
  finhack project create --project_path={path}      # 创建新项目
  finhack collector run --vendor=tushare            # 数据采集
  finhack factor run                                # 计算因子
  finhack trader run --vendor=backtest --strategy   # 运行回测

模块说明:
  project    项目管理
  collector  数据采集 (tushare)
  kline      K线数据缓存
  factor     因子计算与分析
  trader     交易/回测 (backtest/sim/qmt/miniqmt)
  trainer    模型训练 (lightgbm/xgboost/catboost)
  helper     辅助工具

全局参数:
  --vendor      模块供应商
  --background  后台运行
  --project_path 项目路径

查看完整帮助: finhack -h
文档: https://github.com/FinHackCN/FinHack